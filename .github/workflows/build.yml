name: Build and test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # everything (the core, the window, the command line tools) and the tests, on every system it is to run on
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build StlConverter.slnx -c Release
      - run: dotnet test tests/RsDocx.Tests -c Release
