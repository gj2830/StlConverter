name: Release

# a tag such as v0.1 makes a release with the converter ready to run (Windows, no .NET needed): the window
# (StlConverter.exe) and the command line tool (stl2rsdocx.exe)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/RsDocx.Tests -c Release
      - run: dotnet publish tools/StlConverter -c Release -r win-x64 --self-contained true -o publish
      - run: dotnet publish tools/stl2rsdocx -c Release -r win-x64 --self-contained true -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath StlConverter-${{ github.ref_name }}-win-x64.zip
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} StlConverter-${{ github.ref_name }}-win-x64.zip --title "StlConverter ${{ github.ref_name }}" --generate-notes
